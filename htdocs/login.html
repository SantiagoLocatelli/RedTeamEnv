<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Underworld Staff Portal — House of Hades</title>
  <style>
    :root{
      --bg:#0b0a10; --panel:#15121d; --panel-2:#1d1829;
      --gold:#c8a85a; --gold-soft:#e7d7a6; --text:#e9e6f0;
      --muted:#8a8398; --border:#2c2438; --danger:#b4546b;
    }
    *{box-sizing:border-box}
    body{
      margin:0; min-height:100vh; font-family:Georgia,'Times New Roman',serif;
      color:var(--text);
      background:
        radial-gradient(1200px 600px at 50% -10%, #241b33 0%, transparent 60%),
        radial-gradient(800px 400px at 50% 110%, #2a1420 0%, transparent 55%),
        var(--bg);
      display:flex; align-items:center; justify-content:center; padding:1.5rem;
    }
    .card{
      width:100%; max-width:360px; background:linear-gradient(180deg,var(--panel),var(--panel-2));
      border:1px solid var(--border); border-radius:14px; padding:2.2rem 2rem;
      box-shadow:0 20px 60px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.04);
    }
    .crest{text-align:center; font-size:2.1rem; margin-bottom:.3rem; color:var(--gold)}
    h1{
      font-size:1.15rem; letter-spacing:.14em; text-transform:uppercase;
      text-align:center; margin:.1rem 0 .1rem; color:var(--gold-soft); font-weight:600;
    }
    .sub{text-align:center; color:var(--muted); font-size:.78rem; letter-spacing:.05em; margin-bottom:1.6rem}
    label{display:block; font-size:.72rem; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-bottom:.35rem}
    input{
      width:100%; padding:.7rem .8rem; margin-bottom:1.1rem; background:#0f0c16;
      border:1px solid var(--border); border-radius:8px; color:var(--text);
      font-family:inherit; font-size:.95rem; outline:none; transition:border-color .15s,box-shadow .15s;
    }
    input:focus{border-color:var(--gold); box-shadow:0 0 0 3px rgba(200,168,90,.15)}
    button{
      width:100%; padding:.8rem; border:none; border-radius:8px; cursor:pointer;
      background:linear-gradient(180deg,#c8a85a,#a8863f); color:#1a1410;
      font-family:inherit; font-weight:700; letter-spacing:.08em; text-transform:uppercase; font-size:.85rem;
      transition:filter .15s;
    }
    button:hover{filter:brightness(1.08)}
    .foot{text-align:center; color:var(--muted); font-size:.68rem; margin-top:1.4rem; line-height:1.5}
    .foot span{color:var(--gold)}
  </style>
</head>
<body>
  <main class="card">
    <div class="crest">&#9906;</div>
    <h1>House of Hades</h1>
    <p class="sub">Underworld Staff Portal</p>
    <form action="/cgi-bin/login.py" method="POST">
      <label for="username">Keeper ID</label>
      <input type="text" id="username" name="username" autocomplete="off" required>
      <label for="password">Passphrase</label>
      <input type="password" id="password" name="password" required>
      <button type="submit">Descend</button>
    </form>
    <p class="foot">Authorised wardens of Tartarus only.<br><span>&#10013;</span> By order of the Lord of the Dead</p>
  </main>
</body>
</html>
